# Deny-all ingress and egress for OSL operator pods.
# As a layered product in a shared namespace, only pods with the OSL operator
# label are selected. This does not affect other pods in the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: logic-operator-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sonataflow-operator
  policyTypes:
  - Ingress
  - Egress
