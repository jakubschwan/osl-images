# Allow OSL operator pods to reach the Kubernetes API server.
# The API server is host-networked; its IP and port cannot be constrained
# with NetworkPolicy, so all egress is permitted for these pods.
# See: Developing Network Policies - Egress to the API Server
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: logic-operator-allow-egress-to-api-server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sonataflow-operator
  egress:
  - {}
  policyTypes:
  - Egress
